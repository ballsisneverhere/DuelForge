# DuelForge kits.
# Slots: 0-8 = hotbar, 9-35 = inventory (editable by players in the kit editor).
#        helmet / chestplate / leggings / boots / offhand = fixed equipment.
# Item keys: item, amount, name, lore, enchants {name: level}, unbreakable, color "#RRGGBB" (leather),
#            ability <id from config.yml abilities>, potion {effect, seconds, level}
# Kit keys:  themes [colosseum, sky, castle, wasteland, nether, frozen, sumo] - restrict auto-built maps for this kit
# Enchant / effect names use vanilla ids (sharpness, fire_aspect, speed, slowness, instant_health ...).
# Tools and armor have durability (they can break). Set this to true to make everything unbreakable.
unbreakable-items: false

