  dash:
    name: "&b&lDash"
    description: "&7Launch yourself forward."
    cooldown: 12
    power: 1.0
    lift: 0.2
    sound: "entity.bat.takeoff"
  smoke_bomb:
    name: "&8&lSmoke Bomb"
    description: "&7Briefly blind nearby enemies."
    cooldown: 30
    radius: 3
    blind-seconds: 1.5
    invisible-seconds: 2
    speed-seconds: 2.5
  slam:
    name: "&9&lGround Slam"
    description: "&7Shove and lightly hurt nearby enemies."
    cooldown: 22
    radius: 3.5
    damage: 2
    knockback: 0.6
    lift: 0.35
    slow-seconds: 1
  leap:
    name: "&a&lLeap"
    description: "&7Hop away from danger."
    cooldown: 10
    power: 0.7
    lift: 0.4
  berserk:
    name: "&4&lBerserk"
