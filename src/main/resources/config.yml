# ============================================================
#  DuelForge configuration
# ============================================================

lobby:
  # set the lobby with /duel admin setlobby (or /duel admin world create <name>)
  return-to-lobby: true   # true = go to the lobby after a match, false = back to where they were
  teleport-on-join: true  # send players to the lobby when they join the server
  respawn-at-lobby: true  # respawn at the lobby after dying outside a match
  no-hunger: true         # no hunger loss outside matches

world-protection:
  enabled: true           # nobody can break/place blocks outside a duel (only inside arenas during a match)
  disable-pvp: true       # players can only hurt each other inside matches
  explosions: true        # explosions don't destroy blocks outside matches
  # Admins build with:  /duel admin build   (toggles build mode)

duel:
  request-timeout: 30     # seconds before a duel request expires
  countdown: 5
  end-delay: 6            # seconds between match end and teleport back
  time-limit: 600         # seconds, 0 = unlimited (most kills wins on timeout)
  lives: 1
  ranked-enabled: true

ffa:
  enabled: true
  min-players: 2
  max-players: 16
  lives: 3
  countdown: 10
  auto-start-seconds: 30  # lobby auto-starts this long after min players joined
  time-limit: 900
  respawn-protection: 3   # seconds
  broadcast-lobby: true   # announce new lobbies to the whole server

spectator:
  enabled: true

combat:
  remove-arrows: true
  block-commands: true    # block commands during matches (bypass: duelforge.bypass.commands)
  allowed-commands: [msg, tell, w, r, reply, m, help, duel, duels, pvp, accept, deny, duelstats, dstats]
  void-kills: true        # falling below the arena bottom counts as a death
  heal-on-kill: 0         # health points restored to the killer (2 = one heart)
  broadcast-killfeed: false  # also show the kill feed to the whole server
  killstreak-announce: [3, 5, 10, 15, 20]

restore:
  heal-on-return: true

arena:
  restore-blocks-per-tick: 400
  max-tracked-blocks: 30000

elo:
  starting: 1000
  k-factor: 32
  minimum: 100

scoreboard:
  enabled: true

sounds:                   # vanilla sound ids, empty = disabled
  countdown: "block.note_block.pling"
  fight: "entity.ender_dragon.growl"
  hit: "entity.arrow.hit_player"
  kill: "entity.player.levelup"
  death: "entity.player.death"
  victory: "ui.toast.challenge_complete"
  defeat: "entity.villager.no"
  invite: "block.note_block.bell"
  gui-click: "ui.button.click"
  error: "entity.villager.no"

effects:
  kill:
    particle: TOTEM_OF_UNDYING   # modern or legacy names both work
    count: 35
    lightning: false             # harmless visual lightning at the victim
  hit:
    particle: CRIT
    count: 6
  victory:
    fireworks: 6
    colors: ["#FFD700", "#FF4500", "#00BFFF", "#7CFC00"]

# Kit abilities (items with `ability: <id>` in kits.yml). Names, cooldowns and values are all editable.
abilities:
  dash:
    name: "&b&lDash"
    description: "&7Launch yourself forward."
    cooldown: 8
    power: 1.9
    lift: 0.25
    sound: "entity.bat.takeoff"
  smoke_bomb:
    name: "&8&lSmoke Bomb"
    description: "&7Blind nearby enemies and turn invisible."
    cooldown: 20
    radius: 5
    blind-seconds: 3
    invisible-seconds: 4
    speed-seconds: 5
  slam:
    name: "&9&lGround Slam"
    description: "&7Knock back and damage nearby enemies."
    cooldown: 15
    radius: 5
    damage: 4
    knockback: 1.1
    lift: 0.6
    slow-seconds: 2
  leap:
    name: "&a&lLeap"
    description: "&7Jump away from danger."
    cooldown: 7
    power: 1.3
    lift: 0.6
  berserk:
    name: "&4&lBerserk"
    description: "&7Gain Strength and Speed for a short time."
    cooldown: 25
    seconds: 6
    strength-level: 2
    speed-level: 1
  thunder:
    name: "&e&lThunder Wand"
    description: "&7Strike the enemy you are looking at."
    cooldown: 10
    range: 20
    damage: 6
  golden_head:
    name: "&6&lGolden Head"
    description: "&7Consume to heal and gain absorption."
    cooldown: 0
    heal: 8
    absorption-level: 2
    absorption-seconds: 60
    regeneration-seconds: 5
    consume: true
