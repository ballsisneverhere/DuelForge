# ============================================================
#  DuelForge configuration
# ============================================================

lobby:
  # set the lobby with /duel admin setlobby (or /duel admin world create <name>)
  return-to-lobby: true   # true = go to the lobby after a match, false = back to where they were
  teleport-on-join: true  # send players to the lobby when they join the server
  respawn-at-lobby: true  # respawn at the lobby after dying outside a match
  no-hunger: true         # no hunger loss outside matches

world-protection:
  enabled: true           # nobody can break/place blocks outside a duel (only inside arenas during a match)
  disable-pvp: true       # players can only hurt each other inside matches
  explosions: true        # explosions don't destroy blocks outside matches
  # Admins build with:  /duel admin build   (toggles build mode)

duel:
  request-timeout: 30     # seconds before a duel request expires
  countdown: 5
  end-delay: 6            # seconds between match end and teleport back
  time-limit: 600         # per round, seconds, 0 = unlimited (more survivors wins the round on timeout)
  best-of: 3              # default rounds per duel: 1, 3 or 5 (players can change it in the setup menu)
  round-countdown: 3
  lives: 1
  ranked-enabled: true

ffa:
  enabled: true
  min-players: 2
  max-players: 16
  lives: 3
  countdown: 10
  auto-start-seconds: 30  # lobby auto-starts this long after min players joined
  time-limit: 900
  respawn-protection: 3   # seconds
  broadcast-lobby: true   # announce new lobbies to the whole server

spectator:
  enabled: true

combat:
  remove-arrows: true
  block-commands: true    # block commands during matches (bypass: duelforge.bypass.commands)
  allowed-commands: [msg, tell, w, r, reply, m, help, duel, duels, pvp, accept, deny, duelstats, dstats]
  void-kills: true        # falling below the arena bottom counts as a death
  heal-on-kill: 0         # health points restored to the killer (2 = one heart)
  broadcast-killfeed: false  # also show the kill feed to the whole server
  killstreak-announce: [3, 5, 10, 15, 20]

restore:
  heal-on-return: true

arena:
  restore-blocks-per-tick: 400
  max-tracked-blocks: 30000

elo:
  starting: 1000
  k-factor: 32
  minimum: 100

scoreboard:
  enabled: true

sounds:                   # vanilla sound ids, empty = disabled
  countdown: "block.note_block.pling"
  fight: "entity.ender_dragon.growl"
  hit: "entity.arrow.hit_player"
  kill: "entity.player.levelup"
  death: "entity.player.death"
  victory: "ui.toast.challenge_complete"
  defeat: "entity.villager.no"
  invite: "block.note_block.bell"
  gui-click: "ui.button.click"
  error: "entity.villager.no"

# Per-match maps. When auto-build is on, every duel / queue match gets a FRESH map built in a dedicated void world
# (a random theme from the list) and wiped again afterwards. Players can still pick one of your own saved arenas.
matches:
  auto-build: true
  world: duelforge_matches
  themes: [colosseum, sky, castle, wasteland, nether, frozen]   # sumo is only used by kits that ask for it
  max-instances: 16       # matches that can run at the same time with auto-built maps
  slot-spacing: 160

party:
  max-size: 3

leaderboards:
  refresh-seconds: 30

# Hotbar items given in the lobby. action: menu | queue | ffa | stats | cosmetics | friends | party | kits | editor | spectate | duel
hub-items:
  enabled: true
  clear-inventory: true
  items:
    - {slot: 0, item: COMPASS, name: "&a&lDuel Menu &7(Right-click)", lore: ["&7Challenge friends, kits and more."], action: menu}
    - {slot: 1, item: NETHER_STAR, name: "&b&lQueue &7(Right-click)", lore: ["&7Find a 1v1, 2v2 or 3v3 match."], action: queue}
    - {slot: 2, item: IRON_SWORD, name: "&c&lFree-For-All &7(Right-click)", lore: ["&7Join or host a free-for-all."], action: ffa}
    - {slot: 4, item: BOOK, name: "&e&lStats &7(Right-click)", lore: ["&7Your stats and the leaderboard."], action: stats}
    - {slot: 6, item: ENDER_CHEST, name: "&d&lCosmetics &7(Right-click)", lore: ["&7Kill effects, fireworks, hit particles."], action: cosmetics}
    - {slot: 7, item: PLAYER_HEAD, name: "&a&lFriends &7(Right-click)", lore: ["&7Your friends list."], action: friends}
    - {slot: 8, item: NAME_TAG, name: "&6&lParty &7(Right-click)", lore: ["&7Group up for 2v2 / 3v3."], action: party}

# Player-selectable cosmetics (shown in the Cosmetics menu, max 7 per row). Add "permission: your.node" to lock one.
cosmetics:
  kill:
    default: {name: "&fDefault", icon: TOTEM_OF_UNDYING, particle: TOTEM_OF_UNDYING, count: 35}
    lightning: {name: "&eLightning Strike", icon: LIGHTNING_ROD, particle: ELECTRIC_SPARK, count: 30, lightning: true}
    hearts: {name: "&cHeart Burst", icon: RED_DYE, particle: HEART, count: 15}
    flames: {name: "&6Inferno", icon: BLAZE_POWDER, particle: FLAME, count: 60}
    smoke: {name: "&8Shadow Smoke", icon: COAL, particle: LARGE_SMOKE, count: 40}
    notes: {name: "&dMusic", icon: NOTE_BLOCK, particle: NOTE, count: 20}
  victory:
    default: {name: "&fClassic Fireworks", icon: FIREWORK_ROCKET, fireworks: 6, colors: ["#FFD700", "#FF4500", "#00BFFF", "#7CFC00"]}
    gold: {name: "&6Golden Show", icon: GOLD_INGOT, fireworks: 10, colors: ["#FFD700", "#FFA500", "#FFFFFF"]}
    ice: {name: "&bIce Show", icon: BLUE_ICE, fireworks: 10, colors: ["#00FFFF", "#FFFFFF", "#4169E1"]}
    rainbow: {name: "&dRainbow Show", icon: LIME_DYE, fireworks: 14, colors: ["#FF0000", "#FFA500", "#FFFF00", "#00FF00", "#0000FF", "#8B00FF"]}
    none: {name: "&7No fireworks", icon: BARRIER, fireworks: 0, colors: []}
  hit:
    crit: {name: "&fCritical", icon: IRON_SWORD, particle: CRIT, count: 6}
    hearts: {name: "&cHearts", icon: RED_DYE, particle: HEART, count: 3}
    flame: {name: "&6Flames", icon: BLAZE_POWDER, particle: FLAME, count: 6}
    smoke: {name: "&8Smoke", icon: COAL, particle: LARGE_SMOKE, count: 4}
    magic: {name: "&bEnchant", icon: ENCHANTED_BOOK, particle: ENCHANTED_HIT, count: 10}
    none: {name: "&7None", icon: BARRIER, particle: none, count: 0}

# Global switch: false removes EVERY ability item from all kits (pure vanilla PvP everywhere).
# (Kits like Classic, Vanilla, NoDebuff, Balls... have no abilities anyway.)
abilities-enabled: true

# Kit abilities (items with `ability: <id>` in kits.yml). Values below are roughly HALF as strong as the old ones
# (about half the damage / knockback / duration, and about 50% longer cooldowns). Seconds may be decimals.
